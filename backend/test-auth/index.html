<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A temporary page for testing Google sign-in with the Levels API."
    />
    <title>Sign in | Levels</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="sign-in-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">L</div>
        <p class="eyebrow">LEVELS</p>
        <h1 id="page-title">Welcome back</h1>
        <p class="subtitle">Sign in with Google to test authentication.</p>

        <button class="google-button" id="google-sign-in" type="button">
          <svg
            class="google-logo"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 48 48"
            aria-hidden="true"
          >
            <path
              fill="#FFC107"
              d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"
            />
            <path
              fill="#FF3D00"
              d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"
            />
            <path
              fill="#4CAF50"
              d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"
            />
            <path
              fill="#1976D2"
              d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8A19.4 19.4 0 0 0 24 4 20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"
            />
          </svg>
          <span class="button-label">Continue with Google</span>
          <span class="button-spinner" aria-hidden="true"></span>
        </button>

        <p class="error-message" id="sign-in-error" role="alert" hidden></p>
        <p class="security-note">
          Authentication is handled securely by Google and Better Auth.
        </p>
      </section>
      <p class="page-footer">Temporary authentication test page</p>
    </main>
  </body>
</html>
