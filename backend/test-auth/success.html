<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Authentication status for the Levels sign-in test."
    />
    <title>Sign-in status | Levels</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./success.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="success-card" aria-labelledby="status-title">
        <div
          class="status-icon is-loading"
          id="status-icon"
          aria-hidden="true"
        ></div>
        <p class="eyebrow">LEVELS</p>
        <h1 class="success-title" id="status-title">Checking your session</h1>
        <p class="welcome-name" id="user-name" hidden></p>
        <p class="user-email" id="user-email" hidden></p>
        <p class="success-message" id="status-message" aria-live="polite">
          Please wait while we verify your sign-in.
        </p>
        <p
          class="error-message success-error"
          id="session-error"
          role="alert"
          hidden
        ></p>
        <button
          class="primary-button"
          id="sign-out"
          type="button"
          hidden
          disabled
        >
          Sign Out
        </button>
        <a class="secondary-button" id="back-to-sign-in" href="./index.html" hidden>
          Back to sign in
        </a>
      </section>
      <p class="page-footer">Temporary authentication test page</p>
    </main>
  </body>
</html>
